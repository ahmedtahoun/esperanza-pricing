<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Esperanza Program Pricing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3efe9;--surface:#fff;--ink:#1f1a17;--muted:#6b625b;--line:#e3dbd0;--accent:#8e1b26;--accent-ink:#fff;--gold:#b98a2e}
@media (prefers-color-scheme:dark){:root{--bg:#141110;--surface:#1d1917;--ink:#efe8e1;--muted:#a89d93;--line:#3a322d;--accent:#e0808a;--accent-ink:#2a0b0f;--gold:#e0b75a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 24px;text-align:center}
svg{width:64px;height:auto}
h1{font-size:22px;margin:16px 0 4px}
.ar{font-family:"IBM Plex Sans Arabic",sans-serif}
p{margin:0 0 24px;color:var(--muted)}
a.btn{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;margin-top:12px;border-radius:12px;text-decoration:none;font-weight:600;font-size:17px;border:1px solid var(--line);color:var(--ink)}
a.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
a.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main class="card">
  <svg viewBox="0 0 64 48" aria-hidden="true"><path d="M32 4 60 44H4Z" fill="var(--accent)"/><path d="M32 4 44 44H32Z" fill="var(--gold)"/></svg>
  <h1>Esperanza Program Pricing</h1>
  <div class="ar" dir="rtl">تسعير برامج إسبيرانزا</div>
  <p>Choose a language · <span class="ar">اختر اللغة</span></p>
  <a class="btn primary ar" href="tour-costing-ar.html" dir="rtl" lang="ar"><span>العربية</span><span aria-hidden="true">←</span></a>
  <a class="btn" href="tour-costing.html"><span>English</span><span aria-hidden="true">→</span></a>
</main>
</body>
</html>
