<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esperanza Program Pricing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Esperanza maroon + gold. A 7-step builder (step bar on top, one step at a time) beside a live price panel; Files, Price lists and Settings are separate views. Logical properties keep it right for Arabic (RTL). */
:root{
  --bg:#f3efe9; --surface:#ffffff; --surface-2:#f8f5f0; --ink:#1f1a17; --muted:#6b625b; --line:#e3dbd0;
  --accent:#8e1b26; --accent-ink:#ffffff; --accent-soft:#f6e5e6; --gold:#b98a2e; --gold-soft:#f7eedb;
  --marker-soft:rgba(201,154,58,.30);
  --warn:#8a5300; --warn-soft:#fff0d2; --danger:#b3261e; --ok:#2e7d4f;
  --pyr-1:#e2b14f; --pyr-2:#b8862b;
  --c-trans:#0d6e74; --c-staff:#8a5aa8; --c-tix:#d4861a; --c-meal:#c4533a; --c-acc:#4b5bb8; --c-fly:#2f7fb5; --c-act:#3f8f4c; --c-extra:#8a9290; --c-foc:#b0577a; --c-profit:#c99a3a;
  --font-ui:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ar:"IBM Plex Sans Arabic","IBM Plex Sans","Geeza Pro","Segoe UI",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141110; --surface:#1d1917; --surface-2:#25201d; --ink:#efe8e1; --muted:#a89d93; --line:#3a322d;
  --accent:#e0808a; --accent-ink:#2a0b0f; --accent-soft:#3a1d21; --gold:#e0b75a; --gold-soft:#352a17;
  --marker-soft:rgba(224,183,90,.20);
  --warn:#f2b75e; --warn-soft:#352812; --danger:#ff8a80; --ok:#7fd1a0;
  --pyr-1:#f0c264; --pyr-2:#c48e36;
  --c-trans:#4cc3bf; --c-staff:#c49ae0; --c-tix:#f0b057; --c-meal:#ee8a72; --c-acc:#8e9bf0; --c-fly:#6fb6e6; --c-act:#78c785; --c-extra:#a3aaa8; --c-foc:#e08fb0; --c-profit:#e0b75a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141110; --surface:#1d1917; --surface-2:#25201d; --ink:#efe8e1; --muted:#a89d93; --line:#3a322d;
  --accent:#e0808a; --accent-ink:#2a0b0f; --accent-soft:#3a1d21; --gold:#e0b75a; --gold-soft:#352a17;
  --marker-soft:rgba(224,183,90,.20);
  --warn:#f2b75e; --warn-soft:#352812; --danger:#ff8a80; --ok:#7fd1a0;
  --pyr-1:#f0c264; --pyr-2:#c48e36;
  --c-trans:#4cc3bf; --c-staff:#c49ae0; --c-tix:#f0b057; --c-meal:#ee8a72; --c-acc:#8e9bf0; --c-fly:#6fb6e6; --c-act:#78c785; --c-extra:#a3aaa8; --c-foc:#e08fb0; --c-profit:#e0b75a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5}
html[lang="ar"] body{font-family:var(--font-ar);font-size:14.5px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.muted{color:var(--muted)} .help{font-size:12px;color:var(--muted)}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1;display:inline-block}
.pyr{display:inline-block;vertical-align:middle}
.num{font-family:var(--font-num);direction:ltr;unicode-bidi:isolate}
input[type="number"],input[type="date"]{direction:ltr}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:16px 10px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand b{display:block;font-size:19px;font-weight:700;color:var(--accent);letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:var(--gold);font-weight:600;letter-spacing:.04em}
.tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.tabs a{padding:6px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;font-size:13px;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.fxbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 10px}
.fxbar label{display:flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap}
.fxbar input{width:4.6rem;padding:4px 6px}
.sample{display:flex;gap:10px;align-items:center;background:var(--gold-soft);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:10px;flex-wrap:wrap}
.sample > span:nth-child(2){flex:1 1 260px}
.sample b{color:var(--gold)}
.s-short,.l-short{display:none}
.fx-chip{display:none;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px}
.suggest{display:flex;flex-direction:column;gap:10px;border:1px dashed var(--accent);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--accent-soft)}
.sg-t{display:flex;gap:8px;align-items:center}
.sg-l{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sg-ar{color:var(--muted)}
html[dir="rtl"] .sg-ar{transform:scaleX(-1);display:inline-block}
.iecard{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:14px;overflow:hidden}
.iecard.open{border-color:var(--accent)}
.ie-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px 12px;text-align:start}
.ie-h > span:nth-child(2){flex:1;min-width:0}.ie-h b{display:block;font-size:13.5px}.ie-h small{display:block;font-size:12px;color:var(--muted)}
.ie-go{flex:none;font-size:12.5px;font-weight:600;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.ie-b{border-top:1px solid var(--line);padding:12px;background:var(--surface-2)}
.tpl.arm{border-color:var(--warn);background:var(--warn-soft)}
.snack{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;padding-inline:14px 8px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.snack[hidden]{display:none}
.snack .btn{background:var(--bg);color:var(--ink);border-color:transparent;font-weight:600}
@media (max-width:1119px){.snack{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
@media (max-width:560px){
  .top{gap:8px;padding-block:10px 8px}
  .brand svg{width:26px;height:auto}.brand b{font-size:17px}.brand small{font-size:10px}
  .fx-chip{display:inline-flex}
  .fxbar{display:none;width:100%;order:5}.fxbar.open{display:flex}
  .tabs{width:100%;order:6;display:grid;grid-template-columns:repeat(4,1fr);border-radius:12px}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:9px;font-size:11.5px}
  .tabs a .emo{font-size:17px}
  .s-short,.l-short{display:inline}.s-long,.l-long{display:none}
  .brand{gap:7px}.top > .seg button{padding:5px 8px}
  .fx-chip{gap:4px;padding:5px 8px;font-size:12px}
  .sample{padding:6px 10px;flex-wrap:nowrap}.sample > span:nth-child(2){flex:1 1 auto}}

/* controls */
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input[type="number"]{font-family:var(--font-num);font-size:13px;text-align:right}
input[type="checkbox"]{width:17px;height:17px;accent-color:var(--accent);margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:8px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn.dashed{border-style:dashed;color:var(--accent);background:transparent;justify-content:center;font-weight:600}
.x{border:0;background:transparent;color:var(--muted);width:30px;height:30px;font-size:18px;line-height:1;display:grid;place-items:center;border-radius:6px;flex:none}
.x:hover{color:var(--danger);background:var(--surface-2)}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:30px;height:30px;display:grid;place-items:center;font-size:14px;color:var(--muted);flex:none}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.06)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);overflow:hidden;direction:ltr;align-self:flex-start}
.stepper button{border:0;background:transparent;width:30px;height:32px;font-size:16px;color:var(--muted)}
.stepper button:hover{color:var(--accent);background:var(--accent-soft)}
.stepper input{width:3.2rem;border:0;border-radius:0;background:transparent;text-align:center;padding:6px 2px}
.lbl{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:4px}
.field{display:flex;flex-direction:column;min-width:0}
.field > input,.field > select{width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip .p{font-family:var(--font-num);font-size:11px;color:var(--muted);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--surface-2);border-radius:6px;padding:3px 8px;max-width:100%}
.flag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--gold);background:var(--gold-soft);border-radius:4px;padding:1px 6px;white-space:nowrap;vertical-align:middle;margin-inline-start:4px}
.peak{display:inline-flex;gap:3px;align-items:center;font-size:11px;font-weight:600;color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent);border-radius:4px;padding:1px 6px;white-space:nowrap}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600}
.sect{display:flex;flex-direction:column;gap:14px}
.sect + .sect{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.sect h3{margin:0;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}

/* step bar */
.stepbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:6px 10px}
.steps-full{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.steps-m{display:none}
@media (max-width:700px){.steps-full{display:none}
  .steps-m{display:flex;flex-direction:column;gap:6px}
  .sm-t{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.sm-t b{font-size:14px}.sm-t small{font-size:12px;color:var(--muted)}
  .sm-bar{display:flex;gap:4px}
  .sm-bar button{flex:1;border:0;background:transparent;padding:8px 0;display:block}
  .sm-bar i{display:block;height:6px;border-radius:3px;background:var(--line)}
  .sm-bar button.done i{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .sm-bar button[aria-current="step"] i{background:var(--accent)}}
.steps-full button{flex:1 0 auto;display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:11px;background:var(--surface);border:1px solid var(--line);text-align:start;min-width:0}
.steps-full button:hover{border-color:var(--accent)}
.steps-full button[aria-current="step"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.steps-full .emo{font-size:18px}
.steps-full b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap}
.steps-full small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;max-width:9.5rem;overflow:hidden;text-overflow:ellipsis}
.stepbar .ck{margin-inline-start:auto;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;border:1.5px solid var(--line);color:transparent;flex:none}
.stepbar button.done .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1120px){.layout{grid-template-columns:minmax(0,1fr) 400px;align-items:start}.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 86px);overflow-y:auto}}
.step-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.step-head{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.s-ico{flex:none;width:48px;height:48px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-size:24px}
.step-head h2{margin:0;font-size:18px;font-weight:700;text-wrap:balance}
.step-head p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:65ch}
.step-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}

/* templates */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tpl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px}
.tpl:hover{border-color:var(--gold);background:var(--gold-soft)}
.tpl .emo{font-size:24px}
.tpl b{font-size:13.5px}
.tpl span{font-size:12px;color:var(--muted)}

/* rooms/kids */
.rooms{display:flex;flex-wrap:wrap;gap:12px}
.room{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:9rem}
.room b{font-size:13px}
.check{display:flex;gap:8px;align-items:center;font-size:12.5px;border-radius:8px;padding:7px 10px}
.check.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.check.bad{background:var(--warn-soft);color:var(--warn)}
.kids{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kid{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding-block:4px;padding-inline:10px 4px}
.kid input{width:4rem;padding:4px 6px}

/* calendar */
.tripbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;padding:12px 14px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.tripbar .field{flex:0 1 12rem}
.tripbar .field:first-child{flex:1 1 9rem;max-width:14rem}.tripbar .field:nth-child(2){flex:0 0 auto}
.trip-sum{flex:1 1 14rem;display:flex;flex-direction:column;gap:2px;font-size:13px;padding-bottom:4px}
.trip-sum b{font-size:14px}
.trip-sum .peak{align-self:flex-start}

/* day cards */
.days{display:flex;flex-direction:column;gap:10px}
.day{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.day.open{border-color:var(--accent);box-shadow:0 2px 12px rgba(142,27,38,.08)}
.day-h{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.day-n{flex:none;width:44px;text-align:center;border-radius:10px;background:var(--accent);color:var(--accent-ink);padding:4px 0;line-height:1.1}
.day-n b{display:block;font-size:16px;font-family:var(--font-num)}
.day-n small{display:block;font-size:10px;opacity:.85}
.day-t{flex:1;min-width:0}
.day-t b{display:flex;gap:6px;align-items:center;font-size:14px;flex-wrap:wrap}
.day-t .d{font-size:12px;color:var(--muted)}
.day-acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.day-sum{display:flex;flex-wrap:wrap;gap:5px;padding-block:0 10px;padding-inline:66px 12px}
.day-ed{border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.dgrp{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.dgrp h4{margin:0;font-size:13px;font-weight:600}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.day-ed > .g2.dgrp{display:grid}
.trl{display:flex;flex-direction:column;gap:6px}
.tr-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px}
.tr-row .n{flex:1 1 180px;min-width:0}
.tr-row .v{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vi{display:inline-flex;gap:2px;color:var(--c-trans);direction:ltr}

/* stays */
.stays{display:flex;flex-direction:column;gap:10px}
.stay{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.stay-h{display:flex;align-items:center;gap:8px}
.stay-h .ic{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:19px;flex:none}
.stay-h .t{flex:1;min-width:0}
.stay-b{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-items:end}
.stay .info{font-size:12px;color:var(--muted)}
.ab{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);margin-inline-end:4px;vertical-align:middle}
.ab.b{background:var(--gold);color:#fff}

/* incl */
.ie{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.ie ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ie li label{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 6px;border-radius:6px}
.ie li input[type="checkbox"]{flex:none;margin-top:2px}
.ie li label:hover{background:var(--surface-2)}
.ie li.off label{color:var(--muted);text-decoration:line-through}
.ie .add{display:flex;gap:6px;margin-top:8px}
.ie .add input{flex:1}

/* review */
.warns{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.warns div{display:flex;gap:8px;align-items:flex-start;font-size:13px;border-radius:8px;padding:7px 10px}
.warns .w{background:var(--warn-soft)}
.warns .i{background:var(--surface-2)}
.rv-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.doc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}

/* One store shared by the English and Arabic pages. The display language is kept per page. */
const STEP_COUNT=5;
const KEY='esperanza-pricing.v4', LANG_KEY='esperanza-pricing.lang.'+LANG_DEFAULT, MIGRATED_KEY='esperanza-pricing.migrated';
const OLD_KEYS=['en','ar'].map(l=>'esperanza-pricing.v4.'+l); // per-page stores before Nov 2026; left in place as a backup
const readJ=k=>{try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}};
const okState=s=>!!(s&&s.v===4&&s.prog&&s.lists);
const EXAMPLE_CLIENTS=['Example – Rossi group (Italy)','مثال – جروب روسي (إيطاليا)'];
function mergeOld(){
  // Both pages may have saved data under their own key. Keep everything: start from the store
  // with more saved files (this page's on a tie) and add what only the other one has.
  const own='esperanza-pricing.v4.'+LANG_DEFAULT;
  const found=OLD_KEYS.map(k=>({k,s:readJ(k)})).filter(x=>okState(x.s))
    .sort((a,b)=>(b.s.files||[]).length-(a.s.files||[]).length||(b.k===own)-(a.k===own));
  if(!found.length) return null;
  const base=found[0].s;
  found.slice(1).forEach(({s:o})=>{
    base.files=base.files||[];
    (o.files||[]).forEach(f=>{const i=base.files.findIndex(x=>x.id===f.id); if(i<0) base.files.push(f); else if((f.saved||'')>(base.files[i].saved||'')) base.files[i]=f;});
    if(o.prog&&!base.files.some(x=>x.id===o.prog.id)&&o.prog.id!==base.prog.id&&!EXAMPLE_CLIENTS.includes(o.prog.client)){
      const d=clone(o.prog); delete d.sum; base.files.push(d); // unsaved work from the other page, kept as a draft in Files
    }
    Object.keys(o.lists||{}).forEach(cat=>{const rows=base.lists[cat]=base.lists[cat]||[]; (o.lists[cat]||[]).forEach(r=>{if(!rows.some(x=>x.id===r.id)) rows.push(r);});});
    (o.rates||[]).forEach(r=>{if(!(base.rates||[]).some(x=>x.id===r.id)) (base.rates=base.rates||[]).push(r);});
    base.seq=Math.max(base.seq||0,o.seq||0);
  });
  return base;
}
function load(){
  let s=readJ(KEY);
  if(!okState(s)&&!localStorage.getItem(MIGRATED_KEY)){
    const m=mergeOld();
    try{localStorage.setItem(MIGRATED_KEY,'1');}catch(e){}
    if(m){s=m; try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
  }
  if(okState(s)){s.ui.lang=pageLang(s);
    // Step numbers changed: Dates + Days merged (7 → 6 steps), then Included folded into Review (6 → 5), Nov 2026
    if(s.ui.steps!==6&&s.ui.steps!==5){if(s.ui.step>=4) s.ui.step--; s.ui.steps=6;}
    if(s.ui.steps===6){if(s.ui.step>=5) s.ui.step=5; s.ui.steps=5;}
    s.ui.step=Math.min(Math.max(1,s.ui.step||1),STEP_COUNT); return s;}
  const d=defaults(LANG_DEFAULT);
  let old=null; try{old=JSON.parse(localStorage.getItem('group-tour-costing.v3.'+LANG_DEFAULT)||'null');}catch(e){}
  if(old&&old.rates){
    if(old.fx) d.fx=old.fx;

const rateOf=c=>c==='EGP'?1:Math.max(num(S.fx[c]),0.0001);
function fmtIn(v,c,whole){const d=(!whole&&Math.abs(v)<10&&Math.abs(v)>0.0001)?1:0; const s=v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); return c==='EGP'?s+' '+curN('EGP'):SYM[c]+s;}

function roundUp(egp,c){c=c||P().cur;const u=rateOf(c),st=Math.max(num(S.set.round),0.01)*(c==='EGP'?10:1);return Math.ceil((egp/u)/st-1e-9)*st*u;}

/* ============ seasons ============ */
function isPeak(dIso){const md=dIso.slice(5);return (S.set.seasons||[]).some(s=>s.from&&s.to&&(s.from<=s.to?(md>=s.from&&md<=s.to):(md>=s.from||md<=s.to)));}
const dayDate=i=>addD(P().start,i);
function pv(row,f,dIso){if(!row) return 0; let v=num(row[f]); if(dIso&&isPeak(dIso)&&num(row.peak)>0) v*=1+num(row.peak)/100; return v*rateOf(row.cur||'EGP');}

/* ============ calculation ============ */
let fleetCache={};
function fleet(seats,rate,mode){
  const key=rate.id+'|'+seats+'|'+mode+'|'+S.set.policy; if(fleetCache[key]!==undefined) return fleetCache[key];
  const Pp=rate.p||{},C=S.caps, ok=v=>num(Pp[v])>0&&num(C[v])>0; let best=null;
  if(mode!=='auto'){ if(ok(mode)){const n=Math.ceil(seats/num(C[mode]));best={counts:{[mode]:n},cost:n*num(Pp[mode]),n,cap:n*num(C[mode])};} return fleetCache[key]=best; }
  const av=['jeep','bus','coaster','hiace','limo'].filter(ok); if(!av.length) return fleetCache[key]=null;
  const last=av[av.length-1], heads=av.slice(0,-1);
  const rec=(i,counts,cap)=>{
    if(i===heads.length){const rem=Math.max(0,seats-cap), n=Math.ceil(rem/num(C[last])); const c=Object.assign({},counts,{[last]:n});
      const ks=Object.keys(c), tot=ks.reduce((a,v)=>a+c[v],0), cost=ks.reduce((a,v)=>a+c[v]*num(Pp[v]),0), cp=ks.reduce((a,v)=>a+c[v]*num(C[v]),0);
      if(tot===0&&seats>0) return;
      const better=!best||(S.set.policy==='cheapest'?(cost<best.cost||(cost===best.cost&&tot<best.n)):(tot<best.n||(tot===best.n&&cost<best.cost)));
      if(better) best={counts:c,cost,n:tot,cap:cp}; return;}
    const v=heads[i], mx=Math.ceil(Math.max(0,seats-cap)/num(C[v]));
    for(let k=0;k<=mx;k++) rec(i+1,Object.assign({},counts,{[v]:k}),cap+k*num(C[v]));
  };
  rec(0,{},0); return fleetCache[key]=best;
}
const fleetTxt=f=>VEH.filter(v=>f.counts[v]).map(v=>f.counts[v]+' '+vName(v,f.counts[v])).join(' + ');
function vehSvg(v,s){const W={limo:20,hiace:24,coaster:32,bus:44,jeep:22}[v];let w='';const wins=Math.floor((W-8)/5);for(let i=0;i<wins;i++) w+=`<rect x="${4+i*5}" y="4" width="3.5" height="3.5" rx=".6" style="fill:var(--surface)"/>`;s=s||1;
  return `<svg width="${W*s}" height="${16*s}" viewBox="0 0 ${W} 16" aria-hidden="true"><rect x=".5" y="${v==='limo'?4:1.5}" width="${W-1}" height="${v==='limo'?8:10.5}" rx="2.5" fill="currentColor"/>${v==='limo'?'':w}<circle cx="5.5" cy="13" r="2.4" style="fill:var(--ink);stroke:var(--surface);stroke-width:1"/><circle cx="${W-5.5}" cy="13" r="2.4" style="fill:var(--ink);stroke:var(--surface);stroke-width:1"/></svg>`;}
const fleetIco=(f,max,s)=>{let o='',n=0;['bus','coaster','hiace','jeep','limo'].forEach(v=>{for(let i=0;i<(f.counts[v]||0)&&n<(max||5);i++,n++) o+=vehSvg(v,s);});return o;};
function guideFor(city){const g=S.lists.guides, l=P().plang; return g.find(r=>r.lang===l&&r.city===city)||g.find(r=>r.lang===l&&r.city==='cai')||null;}
function natRow(){return L('nats',P().nat)||S.lists.nats[0];}
function nightStays(){const out=[];P().stays.forEach(s=>{for(let i=0;i<num(s.nights);i++) out.push(s);});return out;}
function stayRow(s,which){const id=(which==='b'&&s.b)?s.b:s.a; return s.type==='hotel'?L('hotels',id):s.type==='cruise'?L('cruises',id):null;}
function bandFor(age){const b=(S.set.bands||[]).slice().sort((x,y)=>num(x.to)-num(y.to));for(const x of b) if(age<=num(x.to)) return x; return null;}

function calcTier(Pay){
  const p=P(), F=num(p.focEvery)>0?Math.floor(Pay/num(p.focEvery)):0;
  const kidsSeat=p.children.filter(k=>num(k.age)>=2).length, trav=Pay+F+kidsSeat, seats=trav+Math.max(0,num(S.set.staff));
  const sh={trans:0,staff:0,act:0}, pp={tix:0,meals:0,fly:0,act:0,water:0,gala:0}; const lines={}; let dtips=0;
  p.days.forEach((d,i)=>{
    const dt=dayDate(i);
    d.trans.forEach(t=>{const r=rateById(t.rate); if(!r){lines[t.id]=null;return;} const f=fleet(seats,r,t.mode), m=(t.ret&&r.kind==='transfer')?2:1; lines[t.id]=f?{f,m,cost:f.cost*m}:null;
      if(f){sh.trans+=f.cost*m; if(r.tip&&r.tip!=='none') dtips+=VEH.reduce((a,v)=>a+(f.counts[v]||0)*num((S.dtips[v]||{})[r.tip]),0)*m;}});
    if(d.guide!=='none'){const g=guideFor(d.city); if(g) sh.staff+=pv(g,d.guide==='half'?'half':'full',dt);}
    if(d.rep) sh.staff+=pv(L('reps',d.rep),'price',dt);
    d.tix.forEach(id=>pp.tix+=pv(L('tickets',id),'adult',dt));
    if(d.lunch) pp.meals+=pv(L('rests',d.lunch),'lunch',dt);
    if(d.dinner) pp.meals+=pv(L('rests',d.dinner),'dinner',dt);
    if(d.flight) pp.fly+=pv(L('flights',d.flight),'price',dt);
    if(d.train) pp.fly+=pv(L('trains',d.train),'dbl',dt);
    d.acts.forEach(id=>{const a=L('acts',id); if(!a) return; if(a.unit==='boat') sh.act+=Math.ceil(trav/Math.max(1,num(a.cap)))*pv(a,'price',dt); else pp.act+=pv(a,'price',dt);});
    pp.water+=num(S.set.water.amt)*rateOf(S.set.water.cur);
  });
  if(S.set.vatOn) sh.trans*=1+num(S.set.vat)/100;
  if(S.set.driverTips) sh.trans+=dtips;
  const ns=nightStays(); let gala=false;
  ns.forEach((s,n)=>{if(dayDate(n).slice(5)==='12-31'&&S.set.gala.on) gala=true;});
  if(gala) pp.gala=num(S.set.gala.amt)*rateOf(S.set.gala.cur);
  const perP=Object.values(pp).reduce((a,b)=>a+b,0);
  const hasB=p.stays.some(s=>s.b&&s.b!==s.a);
  const acc={};
  ['a','b'].forEach(c=>{const o={dbl:0,tpl:0,sgl:0};
    ns.forEach((s,n)=>{const r=stayRow(s,c), dt=dayDate(n); if(!r) return;
      if(s.type==='hotel'){o.dbl+=pv(r,'dbl',dt)/2; o.tpl+=(num(r.tpl)>0?pv(r,'tpl',dt)/3:pv(r,'dbl',dt)/2); o.sgl+=pv(r,'sgl',dt);}
      else {o.dbl+=pv(r,'dbl',dt); o.tpl+=num(r.tpl)>0?pv(r,'tpl',dt):pv(r,'dbl',dt); o.sgl+=num(r.sgl)>0?pv(r,'sgl',dt):pv(r,'dbl',dt);}});
    acc[c]=o;});
  const misc=1+num(S.set.miscPct)/100, pm=p.profitMode, pr=num(p.profit), unit=rateOf(p.cur);
  const prof=x=>pm==='pct'?x*(1+pr/100):x+pr*unit;
  const cat={};
  ['a','b'].forEach(c=>{
    const A=acc[c], foc=F*(perP+A.sgl), shared=sh.trans+sh.staff+sh.act+foc, base=shared/Pay+perP;
    const costD=(base+A.dbl)*misc, costT=(base+A.tpl)*misc, suppC=Math.max(0,(A.sgl-A.dbl))*misc;
    const sellD=roundUp(prof(costD)), sellT=roundUp(prof(costT)), supp=roundUp(pm==='pct'?suppC*(1+pr/100):suppC);
    const kids=p.children.map(k=>{const b=bandFor(num(k.age)), pct=b?num(b.pct):100; return {age:num(k.age),pct,price:pct===0?0:roundUp(sellD*pct/100)};});
    const brk={trans:sh.trans/Pay,staff:sh.staff/Pay,tix:pp.tix,meals:pp.meals,acc:A.dbl,fly:pp.fly,act:sh.act/Pay+pp.act,extra:pp.water+pp.gala+(misc-1)*(base+A.dbl),foc:foc/Pay};
    brk.profit=Math.max(0,sellD-Object.values(brk).reduce((a,b)=>a+b,0));
    cat[c]={acc:A,foc,shared,costD,costT,suppC,sellD,sellT,supp,kids,brk};
  });
  return {Pay,F,trav,seats,lines,sh,pp,perP,hasB,gala,cat};
}
function tierList(){const p=P();return [...new Set([num(p.adults),...p.tiers.map(num)])].filter(n=>n>0).sort((a,b)=>a-b);}
function totals(R,c){
  const p=P(), x=R.cat[c], r=p.rooms, tplP=3*num(r.tpl);
  const kidsRev=x.kids.reduce((a,k)=>a+k.price,0);
  const revenue=R.Pay*x.sellD+num(r.sgl)*x.supp+tplP*(x.sellT-x.sellD)+kidsRev;
  const pf=p.profitMode==='pct'?1+num(p.profit)/100:1;
  const cost=R.Pay*x.costD+num(r.sgl)*x.suppC+tplP*(x.costT-x.costD)+kidsRev/pf;
  return {revenue,cost,profit:revenue-cost,deposit:revenue*num(S.set.deposit)/100,kidsRev};

  if(main&&main.gala) w('i',T(`🎉 The trip includes 31 December — Gala Dinner added (${fmtIn(num(S.set.gala.amt),S.set.gala.cur,true)} per person).`,`🎉 الرحلة فيها ليلة 31 ديسمبر — تمت إضافة Gala Dinner (${fmtIn(num(S.set.gala.amt),S.set.gala.cur,true)} للفرد).`));
  if(main&&main.F) w('i',T(`🎁 ${main.F} free place(s) (1 per ${p.focEvery}); their cost is shared by the ${main.Pay} paying people.`,`🎁 ${main.F} مكان مجاني (1 لكل ${p.focEvery})، وتكلفته موزعة على ${main.Pay} فرد.`));

const CRUISE_ENDS=['lxr','asw'];
// Night j = the night after day j, spent where day j was. A sleeper train that day = night without hotel.
// A Nile day is a cruise night, and so are the Luxor/Aswan days touching it.
// A day trip (one day in another city, same city before and after, no flight/train) sleeps in the base city.
function suggestStays(){
  const p=P(), n=p.days.length-1; if(n<1) return [];
  const cr=p.days.slice(0,n).map(d=>d.city==='nile'&&!d.train);
  for(let ch=true;ch;){ch=false; for(let j=0;j<n;j++){ if(cr[j]) continue; const d=p.days[j];
    if(!d.train&&CRUISE_ENDS.includes(d.city)&&((j>0&&cr[j-1])||(j<n-1&&cr[j+1]))){cr[j]=true; ch=true;} }}
  const blocks=[];
  const sleepCity=j=>{const d=p.days[j], a=p.days[j-1], z=p.days[j+1];
    if(a&&z&&a.city===z.city&&a.city!==d.city&&a.city!=='nile'&&!d.flight&&!z.flight&&!a.train) return a.city;
    return d.city==='nile'?p.arrCity:d.city;};
  for(let j=0;j<n;j++){const d=p.days[j], b=d.train?{type:'none'}:cr[j]?{type:'cruise'}:{type:'hotel',city:sleepCity(j)};
    const last=blocks[blocks.length-1]; if(last&&last.type===b.type&&last.city===b.city) last.nights++; else blocks.push(Object.assign(b,{nights:1}));}
  const used=new Set();
  return blocks.map(b=>{const old=p.stays.find(x=>!used.has(x.id)&&x.type===b.type&&(b.type!=='hotel'||x.city===b.city));
    if(old){used.add(old.id); return Object.assign(clone(old),{nights:b.nights});}
    const same=p.stays.find(x=>x.type===b.type&&(b.type!=='hotel'||x.city===b.city)); // same city again later in the trip: same hotels
    if(same) return Object.assign(clone(same),{id:uid(),nights:b.nights});
    return mkStay(b.type,{city:b.city||p.arrCity,nights:b.nights,label:b.type==='none'?T('Night on the sleeper train','ليلة في قطار النوم'):''});});
}

function clientView(){

    const tx=d.tix.map(id=>(L('tickets',id)||{}).name).filter(Boolean); if(tx.length) parts.push(T('Visits: ','زيارة: ')+tx.join(sep()));

      if(type==='plang') return `<td class="w-s">${sel(a,Object.keys(PLANGS).map(k=>[k,plangN(k)]),r[f],lab)}</td>`;
      if(type==='sel') return `<td class="w-s">${sel(a,Object.keys(OPTS[f]).map(k=>[k,optN(f,k)]),r[f],lab)}</td>`;
      if(type==='chk') return `<td style="text-align:center"><input ${a} type="checkbox"${r[f]?' checked':''} aria-label="${lab}"></td>`;
      return `<td><input ${a} type="text" value="${esc(r[f]??'')}" aria-label="${lab}"></td>`;};
    body=`<p class="help" style="margin-top:0"><b>${T(d.unit[0],d.unit[1])}</b>. ${T('Each price has its own currency. “High season +%” raises it on high-season dates (set in Settings).','كل سعر له عملته. «زيادة الذروة %» ترفعه في تواريخ الذروة (من الإعدادات).')}</p>
      <div class="scroll"><table class="ltbl"><thead><tr>${d.cols.map(([f])=>`<th>${T(COL[f][0],COL[f][1])}</th>`).join('')}<th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr>${d.cols.map(c=>cell(r,c)).join('')}<td style="white-space:nowrap">${r.paper?`<span class="flag" style="background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)">${T('from paper','من الورق')}</span>`:r.sample?`<span class="flag">${T('sample','تجريبي')}</span>`:''}<button class="x" type="button" data-act="lrow-del" data-v="${r.id}" aria-label="×">×</button></td></tr>`).join('')}
      </tbody></table></div><div class="row" style="margin-top:10px"><button class="btn small" type="button" data-act="lrow-add">+ ${T('Add row','إضافة سطر')}</button></div>`;
  }
  $('#view').innerHTML=`<div class="card">${tabs}${body}</div>`;
}

/* ============ settings ============ */
function renderSettings(){
  const s=S.set, inp=(path,val,w,step)=>`<input data-s="${path}" type="number" min="0" step="${step||'any'}" value="${esc(val)}" style="width:${w||'5.5rem'}" aria-label="${esc(path)}">`;
  $('#view').innerHTML=`<div class="sets">
    <div class="card sect"><h3>💰 ${T('Profit & rounding','الربح والتقريب')}</h3>
      <div class="row"><span class="lbl" style="margin:0">${T('Default for new programs','الافتراضي للبرامج الجديدة')}</span>${segB('sset','profitMode',[['pct','%'],['fixed',T('fixed per person','ثابت للفرد')]],s.profitMode)} ${inp('profit',s.profit)}</div>
      <div class="row"><span class="lbl" style="margin:0">${T('This program','هذا البرنامج')}</span>${segB('pset','profitMode',[['pct','%'],['fixed',T('fixed per person','ثابت للفرد')]],P().profitMode)}<input data-p="profit" type="number" min="0" step="any" value="${esc(P().profit)}" style="width:5.5rem" aria-label="profit"></div>
      <div class="row"><span class="lbl" style="margin:0">${T('Round prices up to the nearest','تقريب السعر لأعلى لأقرب')}</span>${segB('sset','round',[['1','1'],['5','5'],['10','10']],s.round)}</div></div>
    <div class="card sect"><h3>🧒 ${T('Children prices by age','أسعار الأطفال حسب السن')}</h3>
      ${s.bands.map((b,i)=>`<div class="row"><span class="lbl" style="margin:0">${T('Up to age','حتى سن')}</span>${inp(`bands.${i}.to`,b.to,'4.5rem')}<span>→</span>${inp(`bands.${i}.pct`,b.pct,'4.5rem')}<span>% ${T('of the adult price','من سعر الكبير')}</span></div>`).join('')}
      <div class="help">${T('Older children pay the adult price.','الأكبر يدفع سعر الكبير.')}</div></div>
    <div class="card sect"><h3>🔥 ${T('High seasons','مواسم الذروة')}</h3>
      ${s.seasons.map((x,i)=>`<div class="row"><input data-s="seasons.${i}.name" type="text" value="${esc(x.name)}" style="width:11rem" aria-label="${T('Season','الموسم')}"><input data-s="seasons.${i}.from" type="text" value="${esc(x.from)}" placeholder="MM-DD" style="width:4.8rem" dir="ltr" aria-label="${T('From','من')}"><span>→</span><input data-s="seasons.${i}.to" type="text" value="${esc(x.to)}" placeholder="MM-DD" style="width:4.8rem" dir="ltr" aria-label="${T('To','إلى')}"><button class="x" type="button" data-act="season-del" data-v="${i}" aria-label="×">×</button></div>`).join('')}
      <button class="btn small" type="button" data-act="season-add">+ ${T('Add season','إضافة موسم')}</button>
      <div class="row"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-s="gala.on"${s.gala.on?' checked':''}> 🎉 ${T('Gala Dinner on 31 Dec, per person','Gala Dinner ليلة 31 ديسمبر للفرد')}</label>${inp('gala.amt',s.gala.amt)}${sel('data-s="gala.cur"',CURS.map(c=>[c,c]),s.gala.cur,'')}</div></div>
    <div class="card sect"><h3>🚌 ${T('Transport rules','قواعد النقل')}</h3>
      <div class="row">${segB('sset','policy',[['fewest',T('Fewest vehicles','أقل عدد عربيات')],['cheapest',T('Cheapest','الأرخص')]],s.policy)}</div>
      <div class="row"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-s="vatOn"${s.vatOn?' checked':''}> ${T('VAT on transport','ضريبة على النقل')}</label>${inp('vat',s.vat,'4.5rem')}%</div>
      <div class="row"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-s="driverTips"${s.driverTips?' checked':''}> ${T('Add driver tips (اكراميات) to the cost','إضافة إكراميات السواقين للتكلفة')}</label></div>
      <div class="row"><span class="lbl" style="margin:0">${T('Extra seats for guide & rep','كراسي المرشد والمندوب')}</span>${inp('staff',s.staff,'4.5rem',1)}</div></div>
    <div class="card sect"><h3>💧 ${T('Water & small expenses','المياه والمصاريف الصغيرة')}</h3>
      <div class="row"><span class="lbl" style="margin:0">${T('Water per person per day','مياه للفرد في اليوم')}</span>${inp('water.amt',s.water.amt)}${sel('data-s="water.cur"',CURS.map(c=>[c,c]),s.water.cur,'')}</div>
      <div class="row"><span class="lbl" style="margin:0">${T('Extra % (bank fees, small costs)','نسبة إضافية (مصاريف بنكية…)')}</span>${inp('miscPct',s.miscPct,'4.5rem')}%</div>
      <div class="row"><span class="lbl" style="margin:0">🎁 ${T('Default: 1 free place every','افتراضي: مكان مجاني لكل')}</span>${inp('focEvery',s.focEvery,'4.5rem',1)}</div></div>
    <div class="card sect"><h3>🧾 ${T('Deposit','العربون')}</h3>
      <div class="row">${inp('deposit',s.deposit,'4.5rem')}% · ${T('due','قبل الوصول بـ')} ${inp('depositDays',s.depositDays,'4.5rem',1)} ${T('days before arrival','يوم')}</div></div>
    <div class="card sect"><h3>↩️ ${T('Start over','البدء من جديد')}</h3><p class="help" style="margin:0">${T('Puts back all sample prices and settings. Saved files are deleted too.','يرجع كل الأسعار والإعدادات التجريبية. الملفات المحفوظة تتحذف كمان.')}</p><button class="btn danger" type="button" data-act="reset">${S.ui.resetArm?T('Click again to confirm','اضغط تاني للتأكيد'):T('Reset everything','إعادة ضبط كل شيء')}</button></div>
  </div>`;
}

/* ============ editing ============ */
function setPath(obj,path,val){const k=path.split('.');let o=obj;for(let i=0;i<k.length-1;i++) o=o[k[i]];o[k[k.length-1]]=val;}
function onInput(e){
  const el=e.target, d=el.dataset; if(!el.matches||!el.matches('input,select,textarea')) return;
  const isChk=el.type==='checkbox', commit=isChk||el.tagName==='SELECT'||el.type==='date';
  if(e.type==='input'&&commit) return; if(e.type==='change'&&!commit) return;
  const val=isChk?el.checked:(el.type==='number'?num(el.value):el.value); const p=P();
  if(d.fx){S.fx[d.fx]=val; S.fxDate=todayIso(); const c=$('#fx-chip'); if(c) c.innerHTML=fxChipTxt();}
  else if(d.p){
    if(d.p==='ndays'){setDays(Math.max(1,Math.round(val))); save(); renderStep(); refresh(); return;}
    p[d.p]=(d.p==='adults'||d.p==='focEvery')?Math.max(0,Math.round(val)):val;
    if(d.p==='start'||d.p==='nat'||d.p==='arrCity'){ if(d.p==='arrCity'&&p.days[0]) p.days[0].city=val; save(); renderStep(); refresh(); return;}
    if(d.p==='adults'&&S.ui.focus&&!tierList().includes(S.ui.focus)) S.ui.focus=null; }
  else if(d.room){p.rooms[d.room]=Math.max(0,Math.round(val));}
  else if(d.kid){const k=p.children.find(x=>x.id===d.kid); if(k) k.age=val;}
  else if(d.day){const [id,f]=d.day.split(':'), day=p.days.find(x=>x.id===id); if(!day) return; day[f]=val;
    if(f==='city'&&p.days[0]===day) p.arrCity=val;
    if((f==='flight'||f==='train')&&!val) travelOpen.delete(id+':'+f);
    if(f==='city') S.lists.tickets.filter(t=>t.auto&&t.city===val).forEach(t=>{if(!day.tix.includes(t.id)) day.tix.push(t.id);});
    if(el.tagName==='SELECT'){save(); renderStep(); refresh(); return;}}
  else if(d.trmode){const [did,tid]=d.trmode.split(':'), day=p.days.find(x=>x.id===did), t=day&&day.trans.find(x=>x.id===tid); if(t) t.mode=val;}
  else if(d.tradd!==undefined){ if(!val) return; const day=p.days.find(x=>x.id===d.tradd); if(day) day.trans.push(trn(val)); save(); renderStep(); refresh(); return;}
  else if(d.stay){const [id,f]=d.stay.split(':'), s=p.stays.find(x=>x.id===id); if(!s) return; s[f]=f==='nights'?Math.max(0,Math.round(val)):val;
    if(f==='a'&&s.type==='cruise'){const r=L('cruises',val); if(r) s.nights=num(r.nights);}
    if(el.tagName==='SELECT'){save(); renderStep(); refresh(); return;}}
  else if(d.l){const [cat,id,f]=d.l.split(':'), r=(S.lists[cat]||[]).find(x=>x.id===id); if(r){r[f]=val; r.sample=false;}}
  else if(d.rate){const [id,f]=d.rate.split(':'), r=rateById(id); if(r){ if(f.startsWith('p.')) r.p[f.slice(2)]=val; else r[f]=val; r.sample=false;}}
  else if(d.cap){S.caps[d.cap]=val;}
  else if(d.s){setPath(S.set,d.s,val);}
  else return;
  save(); if(viewName()==='program') refresh();
}
document.addEventListener('input',onInput); document.addEventListener('change',onInput);
function setDays(n){const p=P(); while(p.days.length<n){const prev=p.days[p.days.length-1]; p.days.push(mkDay(prev?prev.city:p.arrCity));} if(p.days.length>n) p.days.length=n;}
function applyTpl(id){const p=P(); p.hide=[]; if(id==='blank'){p.days=[mkDay(p.arrCity,{title:T('Arrival','الوصول')})]; p.stays=[]; p.tpl='blank'; return;} const t=TEMPLATES.find(x=>x.id===id); if(t){t.build(p); p.tpl=id;}}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('add-')){e.preventDefault(); const b=document.querySelector(`[data-act="add-line"][data-v="${e.target.id.slice(4)}"]`); if(b) b.click();}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('day-h')){e.preventDefault(); e.target.click();}
});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.classList.contains('day-h')&&e.target.closest('.day-acts')) return;
  const a=b.dataset.act, id=b.dataset.id, v=b.dataset.v, k=b.dataset.k, dd=num(b.dataset.d), p=P();
  const day=()=>p.days.find(x=>x.id===id);
  const mv=(arr,i,dlt)=>{const j=i+dlt; if(i<0||j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]];};
  switch(a){
    case 'lang': S.ui.lang=v; save(); renderShell(); break;
    case 'hide-sample': S.ui.sample=false; save(); renderShell(); break;
    case 'step': S.ui.step=num(v); save(); if(viewName()!=='program'){location.hash='program';} else {renderStepbar(); renderStep(); renderPanel(); const sb=$('#stepbar'); if(sb&&sb.getBoundingClientRect().top<0) window.scrollTo({top:window.scrollY+sb.getBoundingClientRect().top-8,behavior:reduceMotion()?'auto':'smooth'});} break;
    case 'tpl': {
      if(p.days.length&&tplArm!==v){tplArm=v; clearTimeout(tplTimer); tplTimer=setTimeout(()=>{tplArm=null; if(viewName()==='program'&&S.ui.step===1) renderStep();},5000); renderStep(); break;}
      tplArm=null; const t=TEMPLATES.find(x=>x.id===v), name=t?T(t.n[0],t.n[1]):T('Blank program','برنامج فاضي');
      withUndo(T(`Replaced with “${name}”.`,`تم الاستبدال بـ «${name}».`),()=>applyTpl(v)); S.ui.open=null; S.ui.step=v==='blank'?1:3; save(); renderProgram(); break; }
    case 'fx-toggle': fxOpen=!fxOpen; { const f=$('#fxbar'), c=$('#fx-chip'); if(f) f.classList.toggle('open',fxOpen); if(c) c.setAttribute('aria-expanded',fxOpen); if(fxOpen){const i=$('#fx-USD'); if(i) i.focus();} } break;
    case 'stays-suggest': withUndo(T('Stays rebuilt from the days.','تم بناء الإقامة من الأيام.'),()=>{p.stays=suggestStays();}); save(); renderStep(); refresh(); break;
    case 'ie-toggle': ieOpen=!ieOpen; renderStep(); break;
    case 'undo': if(undoSnap){S.prog=undoSnap.prog; undoSnap=null; clearTimeout(undoTimer); lastBig=null; save(); renderView(); showSnack();} break;
    case 'travel-add': travelOpen.add(id+':'+v); renderStep(); { const el=document.querySelector(`[data-day="${id}:${v}"]`); if(el) el.focus(); } break;
    case 'pset': p[k]=(k==='plang'||k==='cur'||k==='status'||k==='profitMode')?v:+v; save(); if(viewName()==='settings'){renderSettings(); break;} renderStep(); refresh(); break;
    case 'sset': S.set[k]=isNaN(+v)?v:+v; save(); renderSettings(); break;
    case 'ui': S.ui[k]=v; save(); renderStep(); break;
    case 'inc': { const inp=b.parentElement.querySelector('input'); inp.value=Math.max(0,num(inp.value)+dd); inp.dispatchEvent(new Event('input',{bubbles:true})); if(inp.dataset.stay&&viewName()==='program'){renderStep();} break; }
    case 'auto-rooms': {const n=num(p.adults); p.rooms={sgl:n%2,dbl:Math.floor(n/2),tpl:0}; save(); renderStep(); refresh(); break;}
    case 'kid-add': p.children.push({id:uid(),age:6}); save(); renderStep(); refresh(); break;
    case 'kid-del': withUndo(T('Child removed.','تم حذف الطفل.'),()=>{p.children=p.children.filter(x=>x.id!==id);}); save(); renderStep(); refresh(); break;
    case 'tier-add': if(!p.tiers.includes(num(v))) p.tiers.push(num(v)); save(); renderStep(); refresh(); break;
    case 'tier-del': p.tiers=p.tiers.filter(n=>n!==num(v)); save(); renderStep(); refresh(); break;
    case 'focus': S.ui.focus=num(v); save(); renderPanel(); break;
    case 'day-open': S.ui.open=S.ui.open===id?null:id; save(); renderStep(); { const el=document.getElementById('day-'+id); if(el&&S.ui.open) el.scrollIntoView({block:'nearest'}); } break;
    case 'day-add': { const prev=p.days[p.days.length-1]; const d=mkDay(prev?prev.city:p.arrCity); p.days.push(d); S.ui.open=d.id; save(); renderStep(); refresh(); break; }
    case 'day-copy': { const i=p.days.findIndex(x=>x.id===id); const c=clone(p.days[i]); c.id=uid(); c.trans.forEach(t=>t.id=uid()); p.days.splice(i+1,0,c); S.ui.open=c.id; save(); renderStep(); refresh(); break; }
    case 'day-move': { const i=p.days.findIndex(x=>x.id===id); mv(p.days,i,dd); save(); renderStep(); refresh(); break; }
    case 'day-del': { const n=p.days.findIndex(x=>x.id===id)+1; withUndo(T(`Day ${n} deleted.`,`تم حذف يوم ${n}.`),()=>{p.days=p.days.filter(x=>x.id!==id);}); } save(); renderStep(); refresh(); break;
    case 'day-tog': { const d=day(); if(!d) break; const arr=d[k]; const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); save(); renderStep(); refresh(); break; }
    case 'day-set': { const d=day(); if(d) d[k]=v; save(); renderStep(); refresh(); break; }
    case 'tr-ret': { const d=p.days.find(x=>x.id===b.dataset.day), t=d&&d.trans.find(x=>x.id===k); if(t) t.ret=v==='1'; save(); renderStep(); refresh(); break; }
    case 'tr-del': { const d=day(); if(d) withUndo(T('Transport removed.','تم حذف النقل.'),()=>{d.trans=d.trans.filter(x=>x.id!==v);}); save(); renderStep(); refresh(); break; }
    case 'stay-add': { const last=p.stays[p.stays.length-1]; p.stays.push(mkStay(v,{city:(last&&last.city)||p.arrCity,nights:1,label:v==='none'?T('Night on the sleeper train','ليلة في قطار النوم'):''})); save(); renderStep(); refresh(); break; }
    case 'stay-move': { const i=p.stays.findIndex(x=>x.id===id); mv(p.stays,i,dd); save(); renderStep(); refresh(); break; }
    case 'stay-del': withUndo(T('Stay removed.','تم حذف الإقامة.'),()=>{p.stays=p.stays.filter(x=>x.id!==id);}); save(); renderStep(); refresh(); break;
    case 'hide': { const i=p.hide.indexOf(v); if(i>=0) p.hide.splice(i,1); else p.hide.push(v); save(); renderStep(); break; }
    case 'add-line': { const inp=$('#add-'+v); const t=inp&&inp.value.trim(); if(!t) break; (v==='in'?p.extraIn:p.extraEx).push(t); save(); renderStep(); break; }
    case 'save-file': { p.saved=todayIso(); const m=RES.main; const snap=clone(p); snap.sum=m?{v:m.cat.a.sellD/rateOf(p.cur),c:p.cur}:null; const i=S.files.findIndex(x=>x.id===p.id); if(i>=0) S.files[i]=snap; else S.files.push(snap); save(); renderStep(); renderStepbar(); const n=$('#saved-note'); if(n) n.textContent='💾 '+T('Saved to Files.','تم الحفظ في الملفات.'); break; }
    case 'new-prog': S.prog=blankProg(); S.ui.step=1; S.ui.open=null; S.ui.focus=null; lastBig=null; save(); if(viewName()==='program') renderView(); else location.hash='program'; break;
    case 'file-open': { const f=S.files.find(x=>x.id===id); if(f){S.prog=clone(f); delete S.prog.sum; S.ui.step=5; S.ui.focus=null; lastBig=null; save(); location.hash='program';} break; }
    case 'file-dup': { const f=S.files.find(x=>x.id===id); if(f){S.prog=clone(f); delete S.prog.sum; S.prog.id=uid(); S.prog.fileNo=nextFileNo(); S.prog.saved=null; S.prog.status='quote'; S.ui.step=1; lastBig=null; save(); location.hash='program';} break; }
    case 'file-del': if(S.ui.delArm!==id){S.ui.delArm=id; renderFiles(); setTimeout(()=>{if(S.ui.delArm===id){S.ui.delArm=null; if(viewName()==='files') renderFiles();}},4000); break;} S.files=S.files.filter(x=>x.id!==id); S.ui.delArm=null; save(); renderFiles(); break;
    case 'list': S.ui.list=v; save(); renderLists(); break;
    case 'lrow-add': { const cat=S.ui.list, d=LISTS[cat], r={id:uid()}; d.cols.forEach(([f,t])=>r[f]=t==='num'||t==='pct'?0:t==='cur'?((cat==='hotels'||cat==='cruises'||cat==='flights'||cat==='nats')?'USD':'EGP'):t==='city'?'cai':t==='plang'?'it':t==='sel'?Object.keys(OPTS[f])[0]:t==='chk'?false:''); S.lists[cat].push(r); save(); renderLists(); break; }
    case 'lrow-del': S.lists[S.ui.list]=S.lists[S.ui.list].filter(r=>r.id!==v); save(); renderLists(); break;
    case 'rate-add': S.rates.push({id:uid(),g:'extra',kind:'transfer',ar:'',en:T('New service','خدمة جديدة'),tip:'day',p:{limo:0,hiace:0,coaster:0,bus:0,jeep:0}}); save(); renderLists(); break;
    case 'rate-del': S.rates=S.rates.filter(r=>r.id!==id); save(); renderLists(); break;
    case 'season-add': S.set.seasons.push({name:T('New season','موسم جديد'),from:'07-01',to:'08-31'}); save(); renderSettings(); break;
    case 'season-del': S.set.seasons.splice(num(v),1); save(); renderSettings(); break;
    case 'reset': if(!S.ui.resetArm){S.ui.resetArm=true; renderSettings(); setTimeout(()=>{if(S.ui.resetArm){S.ui.resetArm=false; if(viewName()==='settings') renderSettings();}},4000); break;} { const lg=S.ui.lang; try{localStorage.removeItem(KEY);}catch(err){} S=load(); S.ui.lang=lg; lastBig=null; save(); renderShell(); } break;
    case 'to-panel': $('#panel').scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'start'}); break;
    case 'copy': { const text=waText(), box=$('#copybox'), toast=$('#toast'); box.dir=isAr()?'rtl':'ltr';
      const fb=()=>{box.hidden=false; box.value=text; box.focus(); box.select(); toast.textContent=T('Copy the text below','النص بالأسفل جاهز للنسخ');};
      try{navigator.clipboard.writeText(text).then(()=>{toast.textContent=T('Copied — paste in WhatsApp','تم النسخ — الصقه في واتساب'); box.hidden=true; setTimeout(()=>toast.textContent='',3000);},fb);}catch(err){fb();} break; }
  }
});
window.addEventListener('hashchange',renderView);
renderShell();
window.__app={S:()=>S,compute,calcTier,totals,RES:()=>RES};
})();
</script>
